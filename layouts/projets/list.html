{{ define "main" }} {{ partial "nav" .}}

<main class="main">
  <h1 class="">{{ .Title }}</h1>
  <div class="markdown">{{ .Content }}</div>
  <ul>
    {{ range sort .Pages "Title" "asc" }}
    <li class="my-2">
      <span>{{.Params.icon}}</span><a href="{{ .Permalink }}"> {{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</main>

{{ end }}
